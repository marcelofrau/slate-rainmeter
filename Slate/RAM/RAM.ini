[Rainmeter]
Update=3000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc

[Metadata]
Name=Slate RAM
Author=Slate Contributors
Information=RAM usage card (QuantoFlx 4x1 style).
Version=2.4

; ---------- Measures ----------

[MeasureRAM]
Measure=PhysicalMemory

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureRAMPercent]
Measure=Calc
Formula=Round(MeasureRAM / MeasureRAMTotal * 100)
MinValue=0
MaxValue=100

[MeasureRAMUsedGB]
Measure=Calc
Formula=MeasureRAM / 1073741824

[MeasureRAMTotalGB]
Measure=Calc
Formula=MeasureRAMTotal / 1073741824
UpdateDivider=-1

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style

[MeterIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\RAM.png

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=RAM

[MeterUsed]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=[MeasureRAMUsedGB:1] GB / [MeasureRAMTotalGB:1] GB

[MeterPercent]
Meter=String
MeterStyle=RightSecondaryStyle
MeasureName=MeasureRAMPercent
X=240
Y=48
StringAlign=RightBottom
NumOfDecimals=0
Text=%1%

[MeterBar]
Meter=Shape
X=10
Y=54
Shape=Rectangle 0,0.5,236,1,0.5,0.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(236 * Clamp([MeasureRAMPercent],0,100) / 100),2,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
