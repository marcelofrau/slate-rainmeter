[Rainmeter]
Update=900000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
WindDirIcon=WindDeg_0.png

[Metadata]
Name=Slate WeatherDetails
Author=Slate Contributors
Information=Wind, Humidity and UV Index compact card (4x1, Open-Meteo).
Version=2.4

; ---------- Measures ----------
; Update=900000 (15 min): zero polling por segundo!

[MeasureWeatherSub]
Measure=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=relative_humidity_2m,wind_speed_10m,wind_direction_10m,uv_index&timezone=auto&forecast_days=1
RegExp=(?si).*"current":\{[^}]*"relative_humidity_2m":([0-9.]+).*"wind_speed_10m":([0-9.]+).*"wind_direction_10m":([0-9.]+).*"uv_index":([0-9.]+)
UpdateRate=1
FinishAction=[!UpdateMeasureGroup WeatherSubChildren][!UpdateMeter *][!Redraw]

[MeasureHumidity]
Measure=WebParser
URL=[MeasureWeatherSub]
StringIndex=1
Group=WeatherSubChildren
UpdateDivider=-1

[MeasureWind]
Measure=WebParser
URL=[MeasureWeatherSub]
StringIndex=2
Group=WeatherSubChildren
UpdateDivider=-1

[MeasureWindDeg]
Measure=WebParser
URL=[MeasureWeatherSub]
StringIndex=3
Group=WeatherSubChildren
UpdateDivider=-1

[MeasureWindDirIdx]
Measure=Calc
Formula=((MeasureWindDeg>=22.5)?((MeasureWindDeg>=67.5)?((MeasureWindDeg>=112.5)?((MeasureWindDeg>=157.5)?((MeasureWindDeg>=202.5)?((MeasureWindDeg>=247.5)?((MeasureWindDeg>=292.5)?((MeasureWindDeg>=337.5)?0:7):6):5):4):3):2):1):0)
Group=WeatherSubChildren
UpdateDivider=-1

[MeasureUV]
Measure=WebParser
URL=[MeasureWeatherSub]
StringIndex=4
Group=WeatherSubChildren
UpdateDivider=-1

[MeasureWindArrowState]
Measure=String
String=[MeasureWindDirIdx:0]
DynamicVariables=1
UpdateDivider=-1
Group=WeatherSubChildren
IfConditionMode=1
IfMatch=^[0-7]$
IfMatchAction=[!SetVariable WindDirIcon "WindDeg_[MeasureWindDirIdx:0].png"]

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style
Shape3=Line 96,12,96,52 | StrokeWidth 1 | Stroke Color 255,255,255,22
Shape4=Line 178,12,178,52 | StrokeWidth 1 | Stroke Color 255,255,255,22

; --- Column 1: WIND ---
[MeterWindLabel]
Meter=String
MeterStyle=FaintStyle
FontSize=8
X=16
Y=12
StringAlign=LeftTop
Text=WIND

[MeterWindArrow]
Meter=Image
ImageName=#@#Images\Icons\#WindDirIcon#
ImageTint=#AccentColor#,240
DynamicVariables=1
X=([MeterWindLabel:XW] + 6)
Y=11
W=14
H=14

[MeterWindVal]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=10
MeasureName=MeasureWind
X=16
Y=34
StringAlign=LeftTop
NumOfDecimals=1
Text=%1 km/h

; --- Column 2: HUMIDITY ---
[MeterHumLabel]
Meter=String
MeterStyle=FaintStyle
FontSize=8
X=108
Y=12
StringAlign=LeftTop
Text=HUMIDITY

[MeterHumVal]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=10
MeasureName=MeasureHumidity
X=108
Y=34
StringAlign=LeftTop
NumOfDecimals=0
Text=%1 %

; --- Column 3: UV INDEX ---
[MeterUVLabel]
Meter=String
MeterStyle=FaintStyle
FontSize=8
X=190
Y=12
StringAlign=LeftTop
Text=UV INDEX

[MeterUVVal]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=10
MeasureName=MeasureUV
X=190
Y=34
StringAlign=LeftTop
NumOfDecimals=2
Text=%1
