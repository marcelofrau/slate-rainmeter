[Rainmeter]
DefaultAlwaysOnTop=-2
Update=-1
AccurateText=1
SkinWidth=256
SkinHeight=520
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate Work AIModels
Author=Slate Contributors
Information=Claude & GitHub Copilot model token price reference sheet (QuantoFlx 4x8 style).
Version=2.7

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x8Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 7,7,18,18,3,3 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Rectangle 12,12,8,8,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape3=Line 11,4,11,7 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape4=Line 16,4,16,7 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape5=Line 21,4,21,7 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape6=Line 11,25,11,28 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape7=Line 16,25,16,28 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape8=Line 21,25,21,28 | StrokeWidth 1.5 | Stroke Color #TextSecondary#

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=AI Model Matrix

[MeterBadge]
Meter=String
MeterStyle=GraphTitleStyle
X=240
Y=23
StringAlign=RightBottom
Text=USD / MTOK

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
Text=Claude · GPT · Gemini

[MeterSubRight]
Meter=String
MeterStyle=RightSecondaryStyle
X=240
Y=48
StringAlign=RightBottom
Text=17m

; --- Inner Table Zone (236x456 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,456,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,75,238,75 | StrokeWidth 1 | Stroke Color 255,255,255,24
Shape3=Line 18,139,238,139 | StrokeWidth 1 | Stroke Color 255,255,255,24
Shape4=Line 18,159,238,159 | StrokeWidth 1 | Stroke Color 255,255,255,18
Shape5=Line 18,303,238,303 | StrokeWidth 1 | Stroke Color 255,255,255,24
Shape6=Line 18,323,238,323 | StrokeWidth 1 | Stroke Color 255,255,255,18
Shape7=Line 18,407,238,407 | StrokeWidth 1 | Stroke Color 255,255,255,24
Shape8=Line 18,427,238,427 | StrokeWidth 1 | Stroke Color 255,255,255,18

