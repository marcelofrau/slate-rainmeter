[Rainmeter]
DefaultAlwaysOnTop=-2
Update=60000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchCost "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
CostCachePath=#SETTINGSPATH#SlateWork\ai-cost.txt
CostStatus=SYNCED
CostMonth=--
CostDay=--
CostPeriod=2026-11
OpusPct=0.0
SonnetPct=0.0
HaikuPct=0.0
OpusTurns=0
SonnetTurns=0
HaikuTurns=0
FinOpsUrl=
CostUpdated=--:--

[Metadata]
Name=Slate Work ClaudeCost
Author=Slate Contributors
Information=Claude Code monthly/daily spend via adi-aie + local model mix (QuantoFlx 4x2 style).
Version=3.0.0

; ---------- Measures ----------

[MeasureFetchCost]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_ai_cost.ps1" -OutFile "#CostCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=15
FinishAction=[!CommandMeasure MeasureCostScript "ReadCache()"]

[MeasureCostScript]
Measure=Script
ScriptFile=#@#Scripts\ai_cost.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Ellipse 16,16,11,11 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 16,9,16,23 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 12,13,19,13 | StrokeWidth 1.5 | Stroke Color #TextPrimary#
Shape4=Line 12,16,19,16 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape5=Line 13,19,20,19 | StrokeWidth 1.5 | Stroke Color #TextPrimary#
LeftMouseUpAction=["#FinOpsUrl#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to open FinOps AI Cost Dashboard

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Claude Spend

[MeterReload]
Meter=Shape
X=226
Y=12
Shape=Ellipse 7,7,5,5 | StrokeWidth 1.4 | Stroke Color #AccentColor#,230 | Fill Color 0,0,0,1
Shape2=Line 10,2,13,3 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
Shape3=Line 13,3,11,6 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureFetchCost "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reload adi-aie user-cost

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=Today  #CostDay#

[MeterMonth]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=11
X=240
Y=48
StringAlign=RightBottom
DynamicVariables=1
Text=#CostMonth#

; --- Inner Model Mix Zone (236x64 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Rectangle 18,64,220,5,2.5,2.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape3=Rectangle 18,64,(220 * Clamp(#OpusPct#,0,100) / 100),5,2.5,2.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape4=Rectangle (18 + 220 * Clamp(#OpusPct#,0,100) / 100),64,(220 * Clamp(#SonnetPct#,0,100) / 100),5,1,1 | StrokeWidth 0 | Fill Color 195,202,214,210
DynamicVariables=1
LeftMouseUpAction=["#FinOpsUrl#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to open FinOps AI Cost Dashboard

[MeterMixRow1L]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=8
X=18
Y=75
DynamicVariables=1
Text=Opus  #OpusPct#%

[MeterMixRow1R]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
FontSize=8
StringAlign=RightTop
X=238
Y=75
DynamicVariables=1
Text=Sonnet  #SonnetPct#%

[MeterMixRow2L]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
X=18
Y=95
DynamicVariables=1
Text=Haiku #HaikuPct#% · #OpusTurns#t

[MeterMixRow2R]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=95
DynamicVariables=1
Text=#CostPeriod# · #CostUpdated#
