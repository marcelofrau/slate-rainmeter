[Rainmeter]
DefaultAlwaysOnTop=-2
Update=60000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchCopilot "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
CopilotCachePath=#SETTINGSPATH#SlateWork\copilot-quota.txt
CopilotStatus=SYNCED
CopilotLeftPct=0.0
CopilotUsed=0
CopilotTotal=25000
CopilotRem=0
CopilotPlan=BUSINESS
CopilotReset=--
CopilotUpdated=--:--

[Metadata]
Name=Slate Work CopilotQuota
Author=Slate Contributors
Information=GitHub Copilot premium interaction quota & reset countdown (QuantoFlx 4x2 style).
Version=2.8

; ---------- Measures ----------

[MeasureFetchCopilot]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_copilot_quota.ps1" -OutFile "#CopilotCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=15
FinishAction=[!CommandMeasure MeasureCopilotScript "ReadCache()"]

[MeasureCopilotScript]
Measure=Script
ScriptFile=#@#Scripts\copilot_quota.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 6,8,20,16,5,5 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Ellipse 12,16,2,2.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape3=Ellipse 20,16,2,2.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape4=Line 11,5,14,8 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape5=Line 21,5,18,8 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
LeftMouseUpAction=[!CommandMeasure MeasureFetchCopilot "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to refresh GitHub Copilot quota

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Copilot Quota

[MeterBadge]
Meter=String
MeterStyle=GraphTitleStyle
X=220
Y=23
StringAlign=RightBottom
DynamicVariables=1
Text=#CopilotPlan#

[MeterReload]
Meter=Shape
X=226
Y=11
Shape=Ellipse 7,7,5,5 | StrokeWidth 1.4 | Stroke Color #AccentColor#,230 | Fill Color 0,0,0,1
Shape2=Line 10,2,13,3 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
Shape3=Line 13,3,11,6 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureFetchCopilot "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reload GitHub Copilot quota

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#CopilotRem# left

[MeterLeftPct]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=11
X=240
Y=48
StringAlign=RightBottom
DynamicVariables=1
Text=#CopilotLeftPct#%

; --- Inner Quota Gauge Zone (236x64 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Rectangle 18,64,220,6,3,3 | StrokeWidth 0 | Fill Color #BarTrack#
Shape3=Rectangle 18,64,(220 * Clamp(#CopilotLeftPct#,0,100) / 100),6,3,3 | StrokeWidth 0 | Fill Color #AccentColor#,235
Shape4=Line 40,64,40,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape5=Line 62,64,62,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape6=Line 84,64,84,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape7=Line 106,64,106,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape8=Line 128,64,128,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape9=Line 150,64,150,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape10=Line 172,64,172,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape11=Line 194,64,194,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape12=Line 216,64,216,70 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape13=Ellipse (18 + Clamp(220 * #CopilotLeftPct# / 100, 3, 217)),67,3,3 | StrokeWidth 0 | Fill Color 242,245,250,255
DynamicVariables=1

[MeterRow1L]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=8
X=18
Y=77
DynamicVariables=1
Text=Used  #CopilotUsed# / #CopilotTotal#

[MeterRow1R]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
FontSize=8
StringAlign=RightTop
X=238
Y=77
DynamicVariables=1
Text=Resets #CopilotReset#

[MeterRow2L]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
X=18
Y=96
Text=Premium Interactions

[MeterRow2R]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=96
DynamicVariables=1
Text=#CopilotUpdated#
