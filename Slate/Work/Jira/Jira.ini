[Rainmeter]
DefaultAlwaysOnTop=-2
Update=300000
AccurateText=1
SkinWidth=256
SkinHeight=192
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchJira "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
JiraCachePath=#SETTINGSPATH#SlateWork\jira.txt
JiraBaseUrl=
JiraStatus=SYNCED
JiraTotal=0
JiraUpdated=--:--
J1Label=Loading Jira tickets...
J1Status=
J1Url=
J2Label=
J2Status=
J2Url=
J3Label=
J3Status=
J3Url=
J4Label=
J4Status=
J4Url=
J5Label=
J5Status=
J5Url=

[Metadata]
Name=Slate Work Jira
Author=Slate Contributors
Information=Compact assigned unresolved Jira tickets with direct links (QuantoFlx 4x3 style).
Version=3.0.0

; ---------- Measures ----------

[MeasureFetchJira]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_jira.ps1" -OutFile "#JiraCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=1
FinishAction=[!CommandMeasure MeasureJiraScript "ReadCache()"]

[MeasureJiraScript]
Measure=Script
ScriptFile=#@#Scripts\jira.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x3Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 6,6,20,20,3,3 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 11,16,15,20 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 15,20,22,12 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
LeftMouseUpAction=["#JiraBaseUrl#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to open Jira in browser

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Jira Tickets

[MeterReload]
Meter=Shape
X=226
Y=12
Shape=Ellipse 7,7,5,5 | StrokeWidth 1.4 | Stroke Color #AccentColor#,230 | Fill Color 0,0,0,1
Shape2=Line 10,2,13,3 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
Shape3=Line 13,3,11,6 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureFetchJira "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reload Jira tickets

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#JiraTotal# unresolved

[MeterUpdated]
Meter=String
MeterStyle=RightSecondaryStyle
FontSize=8
X=240
Y=48
StringAlign=RightBottom
DynamicVariables=1
Text=#JiraUpdated#

; --- Inner Tickets Zone (236x128 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,128,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,75,238,75 | StrokeWidth 1 | Stroke Color 255,255,255,24

[MeterZoneLabel]
Meter=String
MeterStyle=GraphTitleStyle
X=18
Y=71
Text=ASSIGNED TO ME

[MeterZoneRight]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=60
Text=STATUS

[MeterJ1]
Meter=String
MeterStyle=TextStyle
FontSize=8
X=18
Y=82
W=166
ClipString=1
DynamicVariables=1
Text=#J1Label#
ToolTipText=#J1Label#
LeftMouseUpAction=["#J1Url#"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterJ1St]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=8
FontColor=#AccentColor#,255
X=238
Y=82
