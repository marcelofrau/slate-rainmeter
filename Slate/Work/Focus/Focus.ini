[Rainmeter]
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
FocusMinutes=25
FocusStatus=READY
FocusPct=0
FocusIcon=Play.png

[Metadata]
Name=Slate Work Focus
Author=Slate Contributors
Information=Local focus countdown timer with 5-30m presets (QuantoFlx 4x2 style).
Version=2.4

; ---------- Measures ----------

[MeasureFocusTimer]
Measure=Script
ScriptFile=#@#Scripts\focus_timer.lua
FocusMinutes=#FocusMinutes#

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Ellipse 16,16,11,11 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 16,16,16,10 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 16,16,21,16 | StrokeWidth 1.5 | Stroke Color #TextPrimary#
LeftMouseUpAction=[!CommandMeasure MeasureFocusTimer "Toggle()"]
MouseScrollUpAction=[!CommandMeasure MeasureFocusTimer "StepPreset(1)"]
MouseScrollDownAction=[!CommandMeasure MeasureFocusTimer "StepPreset(-1)"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to Start/Pause · Scroll to change duration

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Focus Timer

[MeterStatus]
Meter=String
MeterStyle=GraphTitleStyle
X=240
Y=23
StringAlign=RightBottom
Text=#FocusStatus#
DynamicVariables=1

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#FocusMinutes# min session

[MeterBtnToggle]
Meter=Image
ImageName=#@#Images\Icons\#FocusIcon#
ImageTint=#AccentColor#,255
DynamicVariables=1
X=204
Y=33
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureFocusTimer "Toggle()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Start / Pause

[MeterBtnReset]
Meter=Image
ImageName=#@#Images\Icons\Prev.png
ImageTint=#TextSecondary#
X=226
Y=33
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureFocusTimer "Reset()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reset timer

[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,95,238,95 | StrokeWidth 1 | Stroke Color 255,255,255,18
Shape3=Rectangle 10,116,(236 * Clamp(#FocusPct#,0,100) / 100),2,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterTimer]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=26
MeasureName=MeasureFocusTimer
X=128
Y=77
StringAlign=CenterCenter
Text=%1
LeftMouseUpAction=[!CommandMeasure MeasureFocusTimer "Toggle()"]
MouseScrollUpAction=[!CommandMeasure MeasureFocusTimer "StepPreset(1)"]
MouseScrollDownAction=[!CommandMeasure MeasureFocusTimer "StepPreset(-1)"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to Start/Pause · Scroll to change duration

; --- Preset selector pills: 5 / 10 / 15 / 20 / 25 / 30 min ---
[MeterP5]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
X=30
Y=106
StringAlign=CenterCenter
Text=5m
LeftMouseUpAction=[!CommandMeasure MeasureFocusTimer "SetMinutes(5)"]
MouseActionCursor=1
MouseActionCursorName=HAND

