[Rainmeter]
DefaultAlwaysOnTop=-2
Update=50
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
StopwatchStatus=READY
StopwatchSub=Lap  --:--.--
StopwatchPct=0
StopwatchIcon=Play.png

[Metadata]
Name=Slate Work Stopwatch
Author=Slate Contributors
Information=Local elapsed stopwatch with lap capture (QuantoFlx 4x2 style).
Version=2.4

; ---------- Measures ----------

[MeasureStopwatch]
Measure=Script
ScriptFile=#@#Scripts\stopwatch.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Ellipse 16,17,10,10 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 13,4,19,4 | StrokeWidth 1.5 | Stroke Color #TextPrimary#
Shape3=Line 16,4,16,7 | StrokeWidth 1.5 | Stroke Color #TextPrimary#
Shape4=Line 16,17,21,13 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Toggle()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to Start / Pause

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Stopwatch

[MeterStatus]
Meter=String
MeterStyle=GraphTitleStyle
X=240
Y=23
StringAlign=RightBottom
Text=#StopwatchStatus#
DynamicVariables=1

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#StopwatchSub#

[MeterBtnToggle]
Meter=Image
ImageName=#@#Images\Icons\#StopwatchIcon#
ImageTint=#AccentColor#,255
DynamicVariables=1
X=204
Y=33
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Toggle()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Start / Pause

[MeterBtnReset]
Meter=Image
ImageName=#@#Images\Icons\Prev.png
ImageTint=#TextSecondary#
X=226
Y=33
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Reset()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reset stopwatch

[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,95,238,95 | StrokeWidth 1 | Stroke Color 255,255,255,18
Shape3=Rectangle 10,116,(236 * Clamp(#StopwatchPct#,0,100) / 100),2,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterTimer]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=24
MeasureName=MeasureStopwatch
X=128
Y=77
StringAlign=CenterCenter
Text=%1
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Toggle()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to Start / Pause

[MeterActionStart]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
X=56
Y=106
StringAlign=CenterCenter
Text=START / PAUSE
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Toggle()"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterActionLap]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
FontColor=#AccentColor#,255
X=142
Y=106
StringAlign=CenterCenter
Text=MARK LAP
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Lap()"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterActionReset]
Meter=String
MeterStyle=FaintStyle
FontFace=#FontMono#
FontSize=8
X=212
Y=106
StringAlign=CenterCenter
Text=RESET
LeftMouseUpAction=[!CommandMeasure MeasureStopwatch "Reset()"]
MouseActionCursor=1
MouseActionCursorName=HAND
