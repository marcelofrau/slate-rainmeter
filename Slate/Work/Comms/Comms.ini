[Rainmeter]
DefaultAlwaysOnTop=-2
Update=300000
AccurateText=1
SkinWidth=256
SkinHeight=320
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchComms "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
CommsCachePath=#SETTINGSPATH#SlateWork\work-comms.txt
MailState=0 new mail
UpcomingCount=0
CommsUpdated=--:--
M1Time=--:--
M1Title=Loading agenda...
M2Time=
M2Title=
M3Time=
M3Title=
M4Time=
M4Title=
M5Time=
M5Title=
M6Time=
M6Title=
M7Time=
M7Title=
M8Time=
M8Title=

[Metadata]
Name=Slate Work Comms
Author=Slate Contributors
Information=New Outlook unread mail status + chronological remaining meetings (QuantoFlx 4x5 style).
Version=2.9

; ---------- Measures ----------

[MeasureFetchComms]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_work_comms.ps1" -OutFile "#CommsCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=1
FinishAction=[!CommandMeasure MeasureComms "ReadCache()"]

[MeasureComms]
Measure=Script
ScriptFile=#@#Scripts\work_comms.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x5Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 5,8,22,16,2,2 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 6,9,16,17 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 26,9,16,17 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
LeftMouseUpAction=["olk.exe"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to focus New Outlook

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Outlook

[MeterReload]
Meter=Shape
X=226
Y=12
Shape=Ellipse 7,7,5,5 | StrokeWidth 1.4 | Stroke Color #AccentColor#,230 | Fill Color 0,0,0,1
Shape2=Line 10,2,13,3 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
Shape3=Line 13,3,11,6 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureFetchComms "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reload agenda & mail status

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#MailState#

[MeterUpdated]
Meter=String
MeterStyle=RightSecondaryStyle
FontSize=8
X=240
Y=48
StringAlign=RightBottom
DynamicVariables=1
Text=#CommsUpdated#

; --- Inner Agenda Zone (236x256 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,256,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,75,238,75 | StrokeWidth 1 | Stroke Color 255,255,255,24
LeftMouseUpAction=["olk.exe"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to open Outlook Calendar

[MeterZoneLabel]
Meter=String
MeterStyle=GraphTitleStyle
X=18
Y=71
DynamicVariables=1
Text=TODAY'S AGENDA (#UpcomingCount# LEFT)

[MeterZoneRight]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=60
Text=TIME

; --- 8 Compact Title + Time Rows (sorted chronologically, past events filtered out) ---
[MeterM1Title]
Meter=String
MeterStyle=TextStyle
FontSize=8
X=18
Y=82
W=148
ClipString=1
DynamicVariables=1
Text=#M1Title#
ToolTipText=#M1Title# (#M1Time#)

[MeterM1Time]
Meter=String
