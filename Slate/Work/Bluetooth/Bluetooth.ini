[Rainmeter]
DefaultAlwaysOnTop=-2
Update=30000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchBT "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
BTCachePath=#SETTINGSPATH#SlateWork\bluetooth.txt
BTActiveCount=3
HSName=Jabra Evolve2 85
HSBat=57
HSCharging=0
; Hidden is inverted: 0 shows the bolt, 1 hides it (driven by bluetooth.lua)
HSChargingHidden=1
KBName=MX KEYS B
KBBat=90
KBCharging=0
KBChargingHidden=1
MSName=Dell Mouse MS7421W
MSBat=82
MSCharging=0
MSChargingHidden=1

[Metadata]
Name=Slate Work Bluetooth
Author=Slate Contributors
Information=Compact 3-column active Bluetooth peripheral battery monitor with device icons and tooltips (QuantoFlx 4x1 style).
Version=3.0.0

; ---------- Measures ----------

[MeasureFetchBT]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_bluetooth.ps1" -OutFile "#BTCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=2
FinishAction=[!CommandMeasure MeasureBTScript "ReadCache()"]

[MeasureBTScript]
Measure=Script
ScriptFile=#@#Scripts\bluetooth.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style
Shape3=Line 90,12,90,52 | StrokeWidth 1 | Stroke Color 255,255,255,22
Shape4=Line 172,12,172,52 | StrokeWidth 1 | Stroke Color 255,255,255,22

; --- Column 1: Headset (X=14..84) ---
[MeterHSIcon]
Meter=Shape
X=16
Y=13
Shape=Ellipse 9,9,7,7 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Rectangle 0,9,4,8,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape3=Rectangle 14,9,4,8,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
ToolTipText=#HSName# · #HSBat#%
LeftMouseUpAction=[!CommandMeasure MeasureFetchBT "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterHSVal]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=10
X=80
Y=15
DynamicVariables=1
Text=#HSBat#%
ToolTipText=#HSName# · #HSBat#%
LeftMouseUpAction=["ms-settings:bluetooth"]
MouseActionCursor=1
MouseActionCursorName=HAND

; --- Charging bolt: Windows reports no charging flag, so the script flags a rising battery ---
[MeterHSCharging]
Meter=Shape
X=40
Y=15
Hidden=#HSChargingHidden#
DynamicVariables=1
Shape=Path Bolt | StrokeWidth 0 | Fill Color #AccentColor#,255
Bolt=4,0 | LineTo 0,7 | LineTo 3,7 | LineTo 1.5,12 | LineTo 7,4.5 | LineTo 4,4.5 | ClosePath 1
ToolTipText=#HSName# · charging

[MeterHSBar]
Meter=Shape
X=16
Y=46
Shape=Rectangle 0,0,64,3,1.5,1.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(64 * Clamp(#HSBat#,0,100) / 100),3,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
ToolTipText=#HSName# · #HSBat#%

; --- Column 2: Keyboard (X=98..164) ---
[MeterKBIcon]
Meter=Shape
X=98
Y=15
Shape=Rectangle 0,2,20,13,2,2 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 4,6,6,6 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 9,6,11,6 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape4=Line 14,6,16,6 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape5=Line 5,11,15,11 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
DynamicVariables=1
ToolTipText=#KBName# · #KBBat#%
LeftMouseUpAction=[!CommandMeasure MeasureFetchBT "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterKBVal]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=10
X=162
Y=15
DynamicVariables=1
Text=#KBBat#%
ToolTipText=#KBName# · #KBBat#%
LeftMouseUpAction=["ms-settings:bluetooth"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterKBCharging]
Meter=Shape
X=122
Y=15
Hidden=#KBChargingHidden#
DynamicVariables=1
Shape=Path Bolt | StrokeWidth 0 | Fill Color #AccentColor#,255
Bolt=4,0 | LineTo 0,7 | LineTo 3,7 | LineTo 1.5,12 | LineTo 7,4.5 | LineTo 4,4.5 | ClosePath 1
ToolTipText=#KBName# · charging

[MeterKBBar]
Meter=Shape
X=98
Y=46
Shape=Rectangle 0,0,64,3,1.5,1.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(64 * Clamp(#KBBat#,0,100) / 100),3,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
ToolTipText=#KBName# · #KBBat#%

; --- Column 3: Mouse (X=180..244) ---
[MeterMSIcon]
Meter=Shape
X=180
Y=13
Shape=Rectangle 2,1,13,18,6,6 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 8.5,4,8.5,9 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
DynamicVariables=1
ToolTipText=#MSName# · #MSBat#%
LeftMouseUpAction=[!CommandMeasure MeasureFetchBT "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterMSVal]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=10
X=242
Y=15
DynamicVariables=1
Text=#MSBat#%
ToolTipText=#MSName# · #MSBat#%
LeftMouseUpAction=["ms-settings:bluetooth"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterMSCharging]
Meter=Shape
X=202
Y=15
Hidden=#MSChargingHidden#
DynamicVariables=1
Shape=Path Bolt | StrokeWidth 0 | Fill Color #AccentColor#,255
Bolt=4,0 | LineTo 0,7 | LineTo 3,7 | LineTo 1.5,12 | LineTo 7,4.5 | LineTo 4,4.5 | ClosePath 1
ToolTipText=#MSName# · charging

[MeterMSBar]
Meter=Shape
X=180
Y=46
Shape=Rectangle 0,0,62,3,1.5,1.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(62 * Clamp(#MSBat#,0,100) / 100),3,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
ToolTipText=#MSName# · #MSBat#%
