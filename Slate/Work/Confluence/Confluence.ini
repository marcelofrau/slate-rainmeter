[Rainmeter]
DefaultAlwaysOnTop=-2
Update=300000
AccurateText=1
SkinWidth=256
SkinHeight=192
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureFetchConf "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
ConfCachePath=#SETTINGSPATH#SlateWork\confluence.txt
ConfBaseUrl=
ConfStatus=SYNCED
ConfCount=5
ConfUpdated=--:--
C1Title=Loading Confluence pages...
C1Space=
C1Url=
C2Title=
C2Space=
C2Url=
C3Title=
C3Space=
C3Url=
C4Title=
C4Space=
C4Url=
C5Title=
C5Space=
C5Url=

[Metadata]
Name=Slate Work Confluence
Author=Slate Contributors
Information=Compact recently touched Confluence pages with direct links (QuantoFlx 4x3 style).
Version=2.9

; ---------- Measures ----------

[MeasureFetchConf]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\fetch_confluence.ps1" -OutFile "#ConfCachePath#"
State=Hide
OutputType=UTF8
UpdateDivider=1
FinishAction=[!CommandMeasure MeasureConfScript "ReadCache()"]

[MeasureConfScript]
Measure=Script
ScriptFile=#@#Scripts\confluence.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x3Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 7,5,18,22,2,2 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 11,11,21,11 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 11,16,21,16 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape4=Line 11,21,17,21 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
LeftMouseUpAction=["#ConfBaseUrl#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to open Confluence in browser

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Confluence Docs

[MeterReload]
Meter=Shape
X=226
Y=12
Shape=Ellipse 7,7,5,5 | StrokeWidth 1.4 | Stroke Color #AccentColor#,230 | Fill Color 0,0,0,1
Shape2=Line 10,2,13,3 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
Shape3=Line 13,3,11,6 | StrokeWidth 1.4 | Stroke Color #AccentColor#,255
LeftMouseUpAction=[!CommandMeasure MeasureFetchConf "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Reload Confluence pages

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#ConfCount# recent pages

[MeterUpdated]
Meter=String
MeterStyle=RightSecondaryStyle
FontSize=8
X=240
Y=48
StringAlign=RightBottom
DynamicVariables=1
Text=#ConfUpdated#

; --- Inner Pages Zone (236x128 at X=10, Y=54) ---
[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,128,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
Shape2=Line 18,75,238,75 | StrokeWidth 1 | Stroke Color 255,255,255,24

[MeterZoneLabel]
Meter=String
MeterStyle=GraphTitleStyle
X=18
Y=71
Text=RECENTLY UPDATED

[MeterZoneRight]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=60
Text=SPACE

[MeterC1]
Meter=String
MeterStyle=TextStyle
FontSize=8
X=18
Y=82
W=172
ClipString=1
DynamicVariables=1
Text=#C1Title#
ToolTipText=#C1Title#
LeftMouseUpAction=["#C1Url#"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterC1Sp]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=8
FontColor=#AccentColor#,255
