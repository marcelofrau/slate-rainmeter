[Rainmeter]
DefaultAlwaysOnTop=-2
Update=2000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate Work Battery
Author=Slate Contributors
Information=Notebook battery segmented gauge and history graph (QuantoFlx 4x2 style).
Version=3.0.0

; ---------- Measures ----------

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
MinValue=0
MaxValue=100

[MeasureAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine

[MeasureLifetime]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
Format=%H:%M
Substitute="-1":"Charged","Unknown":"Charged"

[MeasureLoop]
Measure=Calc
Formula=((MeasureLoop + 1) % 240)

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 4,8,20,14,2.5,2.5 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Rectangle 24,11.5,3,7,1,1 | StrokeWidth 0 | Fill Color #TextPrimary#
Shape3=Rectangle 7,11,(14 * Clamp([MeasureBattery],0,100) / 100),8,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Battery

[MeterBadge]
Meter=String
MeterStyle=GraphTitleStyle
MeasureName=MeasureAC
X=240
Y=23
StringAlign=RightBottom
Text=%1
Substitute="0":"ON BATTERY","1":"AC POWER"

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
MeasureName=MeasureLifetime
X=60
Y=48
StringAlign=LeftBottom
Text=Rem  %1

[MeterPercent]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=12
MeasureName=MeasureBattery
X=240
Y=48
StringAlign=RightBottom
NumOfDecimals=0
Text=%1%

; --- Gauge + Graph Zone (236x64 at X=10, Y=54) ---
[MeterGraphZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 0 | Fill Color 255,255,255,255

[MeterGrid]
Meter=Image
Container=MeterGraphZone
ImageName=#@#Images\MonoGrid_480x64_8x8.png
X=(10 - [MeasureLoop])
Y=54
W=480
H=64
ImageTint=255,255,255,32
DynamicVariables=1

[MeterHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureBattery
X=0
Y=54
W=128
H=64
PrimaryColor=#AccentFill#
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureBattery
X=0
Y=54
W=128
H=64
LineColor=#AccentColor#,255
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterGraphBorder]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 0,0,0,0
Shape2=Line 69,108,69,117 | StrokeWidth 1 | Stroke Color 255,255,255,28
Shape3=Line 128,108,128,117 | StrokeWidth 1 | Stroke Color 255,255,255,28
Shape4=Line 187,108,187,117 | StrokeWidth 1 | Stroke Color 255,255,255,28

; --- Segmented luminous charge bar + glow orb inside top of zone ---
[MeterCells]
Meter=Shape
X=18
Y=62
Shape=Rectangle 0,0,220,6,3,3 | StrokeWidth 0 | Fill Color 255,255,255,28
Shape2=Rectangle 0,0,(220 * Clamp([MeasureBattery],0,100) / 100),6,3,3 | StrokeWidth 0 | Fill Color #AccentColor#,235
Shape3=Line 22,0,22,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape4=Line 44,0,44,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape5=Line 66,0,66,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape6=Line 88,0,88,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape7=Line 110,0,110,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape8=Line 132,0,132,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape9=Line 154,0,154,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape10=Line 176,0,176,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape11=Line 198,0,198,6 | StrokeWidth 1.5 | Stroke Color 26,28,34,230
Shape12=Ellipse (Clamp(220 * [MeasureBattery] / 100, 3, 217)),3,6,6 | StrokeWidth 0 | Fill Color #AccentColor#,70
Shape13=Ellipse (Clamp(220 * [MeasureBattery] / 100, 3, 217)),3,3,3 | StrokeWidth 0 | Fill Color 242,245,250,255
DynamicVariables=1

[MeterGraphLabel]
Meter=String
MeterStyle=GraphTitleStyle
X=18
Y=113
Text=CHARGE LEVEL

[MeterScale]
Meter=String
MeterStyle=GraphPeakStyle
X=238
Y=99
Text=100%
