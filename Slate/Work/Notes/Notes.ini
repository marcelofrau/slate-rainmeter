[Rainmeter]
DefaultAlwaysOnTop=-2
Update=5000
AccurateText=1
SkinWidth=256
SkinHeight=384
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
NotesPath=#SETTINGSPATH#SlateWork\work-notes.txt
NotesEditor=%USERPROFILE%\scoop\apps\notepad3\current\Notepad3.exe
NotesCount=0 lines

[Metadata]
Name=Slate Work Notes
Author=Slate Contributors
Information=Local-only tall quick notes pad, stored outside the skin repository (QuantoFlx 4x6 style).
Version=2.4

; ---------- Measures ----------

[MeasureNotes]
Measure=Script
ScriptFile=#@#Scripts\work_notes.lua
UpdateDivider=1

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x6Style

[MeterIcon]
Meter=Shape
X=16
Y=12
Shape=Rectangle 7,6,18,20,2,2 | StrokeWidth 1.5 | Stroke Color #TextPrimary# | Fill Color 0,0,0,0
Shape2=Line 11,12,21,12 | StrokeWidth 1.5 | Stroke Color #AccentColor#,255
Shape3=Line 11,16,21,16 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
Shape4=Line 11,20,17,20 | StrokeWidth 1.5 | Stroke Color #TextSecondary#
LeftMouseUpAction=["#NotesEditor#" "#NotesPath#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to edit local notes

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=8
StringAlign=LeftTop
Text=Quick Notes

[MeterBadge]
Meter=String
MeterStyle=GraphTitleStyle
X=240
Y=23
StringAlign=RightBottom
Text=LOCAL

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
X=60
Y=48
StringAlign=LeftBottom
DynamicVariables=1
Text=#NotesCount#

[MeterEdit]
Meter=String
MeterStyle=RightSecondaryStyle
X=240
Y=48
StringAlign=RightBottom
Text=EDIT
LeftMouseUpAction=["#NotesEditor#" "#NotesPath#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Open local notes in Notepad3

[MeterZone]
Meter=Shape
Shape=Rectangle 10,54,236,320,4,4 | StrokeWidth 1 | Stroke Color #GraphBorder# | Fill Color 255,255,255,6
LeftMouseUpAction=["#NotesEditor#" "#NotesPath#"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to edit local notes

[MeterNotes]
Meter=String
MeasureName=MeasureNotes
MeterStyle=SecondaryStyle
FontFace=#FontMono#
FontSize=9
X=18
Y=62
W=220
H=304
ClipString=2
Text=%1
LeftMouseUpAction=["#NotesEditor#" "#NotesPath#"]
MouseActionCursor=1
MouseActionCursorName=HAND
