[Rainmeter]
DefaultAlwaysOnTop=-2
Update=15000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate WorldClock
Author=Slate Contributors
Information=World clock card for Sao Paulo (QuantoFlx 4x1 style).
Version=2.4

[MeasureWorldTime]
Measure=Time
TimeZone=#WorldTZ#
Format=%H:%M

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style

[MeterIcon]
Meter=Image
ImageName=#@#Images\Icons\World.png
X=14
Y=15
W=34
H=34
AntiAlias=1

[MeterCity]
Meter=String
MeterStyle=BoldStyle
X=60
Y=12
StringAlign=LeftTop
Text=#WorldCity#

[MeterSub]
Meter=String
MeterStyle=SecondaryStyle
X=60
Y=50
StringAlign=LeftBottom
Text=BRT  ·  UTC#WorldTZ#

[MeterTime]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=24
MeasureName=MeasureWorldTime
X=240
Y=32
StringAlign=RightCenter
Text=%1
