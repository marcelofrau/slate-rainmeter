[Rainmeter]
DefaultAlwaysOnTop=-2
Update=15000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate WorldClock
Author=Slate Contributors
Information=Dual world clock card for India & Portland (QuantoFlx 4x1 style).
Version=2.8

; ---------- Measures ----------

[MeasureIndiaTime]
Measure=Time
TimeZone=#WorldTZ1#
Format=%H:%M

[MeasurePortlandTime]
Measure=Time
TimeZone=#WorldTZ2#
DaylightSavingTime=#WorldDST2#
Format=%H:%M

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style
Shape3=Line 128,12,128,52 | StrokeWidth 1 | Stroke Color 255,255,255,22

; --- Column 1: India (IST · UTC+5:30) ---
[MeterCity1]
Meter=String
MeterStyle=GraphTitleStyle
X=16
Y=21
StringAlign=LeftBottom
Text=#WorldCity1#

[MeterSub1]
Meter=String
MeterStyle=GraphPeakStyle
X=116
Y=10
StringAlign=RightTop
Text=IST · +5:30

[MeterTime1]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=20
MeasureName=MeasureIndiaTime
X=16
Y=40
StringAlign=LeftCenter
Text=%1

; --- Column 2: Portland (PT · UTC-8/-7) ---
[MeterCity2]
Meter=String
MeterStyle=GraphTitleStyle
X=140
Y=21
StringAlign=LeftBottom
Text=#WorldCity2#

[MeterSub2]
Meter=String
MeterStyle=GraphPeakStyle
X=240
Y=10
StringAlign=RightTop
Text=PT · UTC-8

[MeterTime2]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=20
MeasureName=MeasurePortlandTime
X=140
Y=40
StringAlign=LeftCenter
Text=%1
