[Rainmeter]
Update=2000
AccurateText=1
SkinWidth=260
SkinHeight=68
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
HoverKnob=0

[Metadata]
Name=Slate Volume
Author=Slate Contributors
Information=Interactive volume slider with mute toggle, drag and scroll (4x1).
Version=2.4

; ---------- Measures ----------

[MeasureAudio]
Measure=Plugin
Plugin=Win7AudioPlugin
MinValue=0
MaxValue=100

[MeasureIconIdx]
Measure=Calc
Formula=(([MeasureAudio:]=-1) ? -1 : Round([MeasureAudio:] / 33.34))
DynamicVariables=1

[MeasureVolLabel]
Measure=String
String=[MeasureAudio:]%
DynamicVariables=1
Substitute="-1%":"MUTE"

[MeasureTargetPct]
Measure=Calc
Formula=([MeterScrollTarget:X])
MinValue=58
MaxValue=196
DynamicVariables=1
IfCondition=([MeasureAudio:]>-1)
IfTrueAction=[!CommandMeasure MeasureAudio "SetVolume [MeasureTargetPct:%,0]"][!UpdateMeasure MeasureAudio][!UpdateMeter *][!Redraw]
IfConditionMode=1
Disabled=1

[MeasureMouse]
Measure=Plugin
Plugin=Mouse
LeftMouseDragAction=[!SetOption MeterScrollTarget X "(Clamp($MouseX$,58,196))"][!UpdateMeasure MeasureTargetPct][!Update]
LeftMouseUpAction=[!CommandMeasure MeasureMouse "Stop"][!DisableMeasure MeasureTargetPct][!DisableMeasure MeasureMouse][!Update]
RelativeToSkin=1
RequireDragging=1
DynamicVariables=1
Disabled=1

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style

[MeterIcon]
Meter=Image
ImageName=#@#Images\Icons\Volume_[MeasureIconIdx:0].png
ImageTint=#TextPrimary#
DynamicVariables=1
X=20
Y=22
W=20
H=20
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureAudio "ToggleMute"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollUpAction=[!CommandMeasure MeasureAudio "ChangeVolume +2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!CommandMeasure MeasureAudio "ChangeVolume -2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to toggle mute

[MeterScrollTarget]
Meter=String
X=(58 + 138 * (Max([MeasureAudio:],0) / 100))
DynamicVariables=1

[MeterSliderVisual]
Meter=Shape
X=58
Y=32
Shape=Rectangle 0,-1.5,138,3,1.5,1.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,-2,(138 * Max([MeasureAudio:],0) / 100),4,2,2 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape3=Ellipse (138 * Max([MeasureAudio:],0) / 100),0,9 | StrokeWidth 0 | Fill Color 255,255,255,64
Shape4=Ellipse (138 * Max([MeasureAudio:],0) / 100),0,8 | StrokeWidth 0 | Fill Color 42,46,54,255
Shape5=Ellipse (138 * Max([MeasureAudio:],0) / 100),0,(5 + #HoverKnob#*2) | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterSliderHit]
Meter=Shape
X=58
Y=12
Shape=Rectangle 0,0,138,40 | StrokeWidth 0 | Fill Color 0,0,0,1
MouseOverAction=[!SetVariable HoverKnob 1][!UpdateMeter MeterSliderVisual][!Redraw]
MouseLeaveAction=[!SetVariable HoverKnob 0][!UpdateMeter MeterSliderVisual][!Redraw]
LeftMouseDownAction=[!SetOption MeterScrollTarget X "(Clamp($MouseX$,58,196))"][!EnableMeasure MeasureTargetPct][!EnableMeasure MeasureMouse][!CommandMeasure MeasureMouse "Start"][!UpdateMeasure MeasureTargetPct][!Update]
MouseScrollUpAction=[!CommandMeasure MeasureAudio "ChangeVolume +2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!CommandMeasure MeasureAudio "ChangeVolume -2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterPercent]
Meter=String
MeterStyle=RightPrimaryStyle
MeasureName=MeasureVolLabel
X=240
Y=32
StringAlign=RightCenter
Text=%1
LeftMouseUpAction=[!CommandMeasure MeasureAudio "ToggleMute"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollUpAction=[!CommandMeasure MeasureAudio "ChangeVolume +2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!CommandMeasure MeasureAudio "ChangeVolume -2"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
MouseActionCursor=1
MouseActionCursorName=HAND
