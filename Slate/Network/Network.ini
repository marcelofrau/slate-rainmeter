[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
AutoScale=MeasureNetPeakRaw|MeasureNetOutGraph|32768|0.985|MeasureNetScalePeak;MeasureNetPeakRaw|MeasureNetInGraph|32768|0.985

[Metadata]
Name=Slate Network
Author=Slate Contributors
Information=Network upload and download graphs (QuantoFlx 4x2 style).
Version=2.4

; ---------- Measures ----------

[MeasureAdapterDesc]
Measure=SysInfo
SysInfoType=ADAPTER_DESCRIPTION
SysInfoData=Best
UpdateDivider=30

[MeasureAdapterAlias]
Measure=SysInfo
SysInfoType=ADAPTER_ALIAS
SysInfoData=Best
UpdateDivider=30
RegExpSubstitute=1
Substitute="^0$":"Network"

[MeasureConnectivity]
Measure=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
SysInfoData=Best
UpdateDivider=15
RegExpSubstitute=1
Substitute="^-1$":"Disconnected","^0$":"Unknown","^1$":"Connected"

[MeasureNetOut]
Measure=NetOut

[MeasureNetIn]
Measure=NetIn

[MeasureNetPeakRaw]
Measure=Calc
Formula=Max(MeasureNetOut, MeasureNetIn)

[MeasureNetOutGraph]
Measure=Calc
Formula=MeasureNetOut
MinValue=0
MaxValue=32768

[MeasureNetInGraph]
Measure=Calc
Formula=MeasureNetIn
MinValue=0
MaxValue=32768

[MeasureNetScalePeak]
Measure=Calc
Formula=32768

[MeasureAutoScale]
Measure=Script
ScriptFile=#@#Scripts\autoscale.lua

[MeasureLoop]
Measure=Calc
Formula=((MeasureLoop + 2) % 240)

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\Network_0_0.png
MaskImageName=#@#Images\Icons\StateContainer_1.png
LeftMouseUpAction=["shell:::{8E908FC9-BECC-40f6-915B-F4CA0E70D03D}"]
ToolTipText=[MeasureAdapterDesc]
DynamicVariables=1

[MeterStateIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\StateIcon_1.png

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
MeasureName=MeasureAdapterAlias
X=60
Y=8
StringAlign=LeftTop
W=96
ClipString=1
Text=%1

[MeterStatus]
Meter=String
MeterStyle=SecondaryStyle
MeasureName=MeasureConnectivity
X=60
Y=48
StringAlign=LeftBottom
Text=%1

[MeterUpRate]
Meter=String
MeterStyle=RightPrimaryStyle
MeasureName=MeasureNetOut
X=220
Y=8
StringAlign=RightTop
AutoScale=1
NumOfDecimals=1
Text=%1B/s

[MeterDownRate]
Meter=String
MeterStyle=RightPrimaryStyle
FontColor=#AccentColor#,255
MeasureName=MeasureNetIn
X=220
Y=48
StringAlign=RightBottom
AutoScale=1
NumOfDecimals=1
Text=%1B/s

[MeterUpArrow]
Meter=Image
ImageName=#@#Images\Icons\AUp.png
ImageTint=255,255,255,160
X=230
Y=10
W=16
H=16

[MeterDownArrow]
Meter=Image
ImageName=#@#Images\Icons\ADown.png
ImageTint=#AccentColor#,255
X=230
Y=30
W=16
H=16

; --- Graph Zone (236x64 at X=10, Y=54) ---
[MeterGraphZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 0 | Fill Color 255,255,255,255

[MeterGrid]
Meter=Image
Container=MeterGraphZone
ImageName=#@#Images\MonoGrid_480x64_8x8.png
X=(10 - [MeasureLoop])
Y=54
W=480
H=64
ImageTint=255,255,255,32
DynamicVariables=1

; Upload (left half: W=64 scaled x2 -> 128px)
[MeterUpHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureNetOutGraph
X=0
Y=54
W=64
H=64
PrimaryColor=255,255,255,32
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterUpLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureNetOutGraph
X=0
Y=54
W=64
H=64
LineColor=255,255,255,140
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0
TransformStroke=Fixed

; Download (right half: X=64 scaled x2 -> starts at 128px)
[MeterDownHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureNetInGraph
X=64
Y=54
W=64
H=64
PrimaryColor=#AccentFill#
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterDownLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureNetInGraph
X=64
Y=54
W=64
H=64
LineColor=#AccentColor#,255
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0
TransformStroke=Fixed

[MeterGraphBorder]
Meter=Shape
X=10
Y=54
Shape=Rectangle 0,0,236,64,4,4 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GraphBorder#
Shape2=Line 118,0,118,64 | StrokeWidth 1 | Stroke Color #GraphBorder#

[MeterUpTitle]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphTitleStyle
FontColor=#TextSecondary#
X=16
Y=112
W=106
Text=Upload

[MeterDownTitle]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphTitleStyle
X=134
Y=112
W=106
Text=Download

[MeterUpPeak]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphPeakStyle
MeasureName=MeasureNetScalePeak
X=122
Y=60
W=106
AutoScale=1
NumOfDecimals=1
Text=%1B/s

[MeterDownPeak]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphPeakStyle
MeasureName=MeasureNetScalePeak
X=240
Y=60
W=106
AutoScale=1
NumOfDecimals=1
Text=%1B/s
