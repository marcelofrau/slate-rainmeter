[Rainmeter]
Update=60000
AccurateText=1
SkinWidth=256
SkinHeight=264
BackgroundMode=2
SolidColor=0,0,0,1
MouseScrollUpAction=[!CommandMeasure MeasureCalendarScript "MoveMonth(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureCalendarScript "MoveMonth(1)"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate Calendar
Author=Slate Contributors
Information=Monthly calendar with Spain & Aragon (Zaragoza) public holidays (4x4).
Version=2.2

; ---------- Measures ----------

[MeasureYear]
Measure=Time
Format=%Y

[MeasureHolidaysWeb]
Measure=WebParser
Url=https://date.nager.at/api/v3/PublicHolidays/[MeasureYear]/ES
RegExp=(?si)^(.*)$
UpdateRate=43200
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureHolidaysData][!CommandMeasure MeasureCalendarScript "OnHolidaysFetched()"]

[MeasureHolidaysData]
Measure=WebParser
URL=[MeasureHolidaysWeb]
StringIndex=1
UpdateDivider=-1

[MeasureCalendarScript]
Measure=Script
ScriptFile=#@#Scripts\calendar.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x4Style
Shape3=Line 16,228,240,228 | StrokeWidth 1 | Stroke Color 255,255,255,22

[MeterPrevMonth]
Meter=Image
ImageName=#@#Images\Icons\ALeft.png
ImageTint=#TextSecondary#
X=24
Y=18
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "MoveMonth(-1)"]
ToolTipText=Previous month

[MeterMonthTitle]
Meter=String
MeterStyle=BoldStyle
FontSize=10
X=128
Y=25
StringAlign=CenterCenter
Text=November, 2026
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "MoveMonth(0)"]
ToolTipText=Click to return to current month

[MeterNextMonth]
Meter=Image
ImageName=#@#Images\Icons\ARight.png
ImageTint=#TextSecondary#
X=218
Y=18
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureCalendarScript "MoveMonth(1)"]
ToolTipText=Next month

