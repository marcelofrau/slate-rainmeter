[Rainmeter]
Update=15000
AccurateText=1
SkinWidth=760
SkinHeight=240
BackgroundMode=1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc

; ---------- Measures ----------

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A  ·  %d %B %Y
UpdateDivider=4

[MeasureQuotes]
Measure=Script
ScriptFile=#@#Scripts\quotes.lua
UpdateDivider=4

[MeasureTypeTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat TypeTick, 25, 40
TypeTick=[!CommandMeasure MeasureQuotes "TypeStep()"]
UpdateDivider=-1

; ---------- Meters ----------

; --- Subtle drop shadow behind the large digital clock ---
[MeterTimeShadow]
Meter=String
FontFace=#FontClock#
FontSize=92
FontColor=0,0,0,130
AntiAlias=1
MeasureName=MeasureTime
X=4
Y=4
StringAlign=LeftTop
Text=%1

[MeterTime]
Meter=String
FontFace=#FontClock#
FontSize=92
FontColor=#TextPrimary#
AntiAlias=1
MeasureName=MeasureTime
X=0
Y=0
StringAlign=LeftTop
Text=%1

; --- Date + Cyber-Sage accent bar ---
[MeterAccentBar]
Meter=Shape
X=4
Y=132
Shape=Rectangle 0,0,36,3,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
Shape2=Line 46,1.5,380,1.5 | StrokeWidth 1 | Stroke Color 255,255,255,35

[MeterDate]
Meter=String
FontFace=#FontBold#
FontSize=10
FontColor=#AccentColor#,245
AntiAlias=1
StringCase=Upper
MeasureName=MeasureDate
X=4
Y=110
StringAlign=LeftTop
Text=%1

; --- Invisible click hit-box for the whole quote area (720x85) ---
[MeterQuoteHit]
Meter=Shape
X=0
Y=140
Shape=Rectangle 0,0,720,90 | StrokeWidth 0 | Fill Color 0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureQuotes "NextQuote()"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click for next quote

; --- Quote block (terminal typewriter animation) ---
[MeterQuoteShadow]
Meter=String
FontFace=#FontMedium#
FontSize=12
FontColor=0,0,0,140
AntiAlias=1
X=5
Y=147
W=720
ClipString=2
StringAlign=LeftTop
Text=""

[MeterQuoteText]
Meter=String
FontFace=#FontMedium#
FontSize=12
FontColor=#TextPrimary#
AntiAlias=1
X=4
Y=146
W=720
ClipString=2
StringAlign=LeftTop
Text=""
LeftMouseUpAction=[!CommandMeasure MeasureQuotes "NextQuote()"]
MouseActionCursor=1
MouseActionCursorName=HAND

[MeterQuoteSource]
Meter=String
FontFace=#FontMono#
FontSize=9
FontColor=#AccentColor#,230
AntiAlias=1
X=4
Y=([MeterQuoteText:YH] + 6)
DynamicVariables=1
StringAlign=LeftTop
Text=""
LeftMouseUpAction=[!CommandMeasure MeasureQuotes "NextQuote()"]
MouseActionCursor=1
MouseActionCursorName=HAND
