[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
AutoScale=MeasureGPUPercent|MeasureGPUGraph|20|0.97|MeasureGPUPeak

[Metadata]
Name=Slate GPU
Author=Slate Contributors
Information=GPU and VRAM usage card (QuantoFlx 4x2 style).
Version=2.4

; ---------- Measures ----------

[MeasureGPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
MinValue=0
MaxValue=100

[MeasureGPUPercent]
Measure=Calc
Formula=MeasureGPU
MinValue=0
MaxValue=100

[MeasureGPUGraph]
Measure=Calc
Formula=MeasureGPUPercent
MinValue=0
MaxValue=100

[MeasureGPUPeak]
Measure=Calc
Formula=100

[MeasureAutoScale]
Measure=Script
ScriptFile=#@#Scripts\autoscale.lua

[MeasureGPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000
RegValue=DriverDesc
RegExpSubstitute=1
Substitute="NVIDIA ":""
UpdateDivider=-1

[MeasureVRAM]
Measure=Plugin
Plugin=UsageMonitor
Alias=VRAM
Index=0
MaxValue=(#GPUTotalMB# * 1048576)
UpdateDivider=2

[MeasureVRAMGB]
Measure=Calc
Formula=MeasureVRAM / 1073741824
UpdateDivider=2

[MeasureLoop]
Measure=Calc
Formula=((MeasureLoop + 2) % 240)

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\NVIDIA.png

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
MeasureName=MeasureGPUName
X=60
Y=8
StringAlign=LeftTop
W=180
ClipString=1
Text=%1

[MeterUsed]
Meter=String
MeterStyle=SecondaryStyle
MeasureName=MeasureGPUPercent
X=60
Y=48
StringAlign=LeftBottom
NumOfDecimals=0
Text=%1% used

[MeterVRAM]
Meter=String
MeterStyle=RightSecondaryStyle
MeasureName=MeasureVRAMGB
X=240
Y=48
StringAlign=RightBottom
NumOfDecimals=1
Text=VRAM %1 GB

; --- Graph Zone (236x64 at X=10, Y=54) ---
[MeterGraphZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 0 | Fill Color 255,255,255,255

[MeterGrid]
Meter=Image
Container=MeterGraphZone
ImageName=#@#Images\MonoGrid_480x64_8x8.png
X=(10 - [MeasureLoop])
Y=54
W=480
H=64
ImageTint=255,255,255,32
DynamicVariables=1

[MeterHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureGPUGraph
X=0
Y=54
W=128
H=64
PrimaryColor=#AccentFill#
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureGPUGraph
X=0
Y=54
W=128
H=64
LineColor=#AccentColor#,255
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0
TransformStroke=Fixed

[MeterGraphBorder]
Meter=Shape
X=10
Y=54
Shape=Rectangle 0,0,236,64,4,4 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GraphBorder#

[MeterGraphTitle]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphTitleStyle
X=16
Y=112
W=106
Text=Utilization

[MeterGraphPeak]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphPeakStyle
MeasureName=MeasureGPUPeak
X=240
Y=60
W=106
NumOfDecimals=0
Text=%1 %
