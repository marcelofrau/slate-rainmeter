[Rainmeter]
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
AutoScale=MeasureCPU|MeasureCPUGraph|20|0.97|MeasureCPUPeak

[Metadata]
Name=Slate CPU
Author=Slate Contributors
Information=CPU usage history graph (QuantoFlx 4x2 style).
Version=2.4

; ---------- Measures ----------

[MeasureCPU]
Measure=CPU
MinValue=0
MaxValue=100

[MeasureCPUGraph]
Measure=Calc
Formula=MeasureCPU
MinValue=0
MaxValue=100

[MeasureCPUPeak]
Measure=Calc
Formula=100

[MeasureAutoScale]
Measure=Script
ScriptFile=#@#Scripts\autoscale.lua

[MeasureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString
UpdateDivider=-1
RegExpSubstitute=1
Substitute="\(R\)":"","\(TM\)":"","\(tm\)":"","Intel ":"","\d+th Gen ":"","CPU ":""," @.*":"","AMD ":""," \w+-Core.*":""," \d+-Core.*":"","\s{2,}":" ","\s$":""

[MeasureMHz]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=~MHz
UpdateDivider=-1

[MeasureGHz]
Measure=Calc
Formula=MeasureMHz / 1000
UpdateDivider=-1

[MeasureLoop]
Measure=Calc
Formula=((MeasureLoop + 2) % 240)

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\AMD.png
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Click to open Task Manager

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
MeasureName=MeasureCPUName
X=60
Y=8
StringAlign=LeftTop
W=180
ClipString=1
Text=%1

[MeterUsed]
Meter=String
MeterStyle=SecondaryStyle
MeasureName=MeasureCPU
X=60
Y=48
StringAlign=LeftBottom
NumOfDecimals=1
Text=%1% used

[MeterClock]
Meter=String
MeterStyle=RightSecondaryStyle
MeasureName=MeasureGHz
X=240
Y=48
StringAlign=RightBottom
NumOfDecimals=2
Text=%1 GHz

; --- Graph Zone (236x64 at X=10, Y=54) ---
[MeterGraphZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 0 | Fill Color 255,255,255,255

[MeterGrid]
Meter=Image
Container=MeterGraphZone
ImageName=#@#Images\MonoGrid_480x64_8x8.png
X=(10 - [MeasureLoop])
Y=54
W=480
H=64
ImageTint=255,255,255,32
DynamicVariables=1

[MeterHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureCPUGraph
X=0
Y=54
W=128
H=64
PrimaryColor=#AccentFill#
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureCPUGraph
X=0
Y=54
W=128
H=64
LineColor=#AccentColor#,255
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0
TransformStroke=Fixed

[MeterGraphBorder]
Meter=Shape
X=10
Y=54
Shape=Rectangle 0,0,236,64,4,4 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GraphBorder#

[MeterGraphTitle]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphTitleStyle
X=16
Y=112
W=106
Text=Utilization

[MeterGraphPeak]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphPeakStyle
MeasureName=MeasureCPUPeak
X=240
Y=60
W=106
NumOfDecimals=0
Text=%1 %
