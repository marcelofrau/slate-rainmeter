[Rainmeter]
Update=25
AccurateText=1
DynamicWindowSize=1
BackgroundMode=1
ContextTitle="16 Columns (Compact)"
ContextAction=[!CommandMeasure MeasureVizScript "SetPreset(16, 12, 4)"]
ContextTitle2="24 Columns (Medium)"
ContextAction2=[!CommandMeasure MeasureVizScript "SetPreset(24, 9, 3)"]
ContextTitle3="32 Columns (Default)"
ContextAction3=[!CommandMeasure MeasureVizScript "SetPreset(32, 8, 3)"]
ContextTitle4="48 Columns (Wide)"
ContextAction4=[!CommandMeasure MeasureVizScript "SetPreset(48, 6, 2)"]
ContextTitle5="64 Columns (Ultra)"
ContextAction5=[!CommandMeasure MeasureVizScript "SetPreset(64, 5, 2)"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc

[Metadata]
Name=Slate Visualizer
Author=Slate Contributors
Information=High-FPS draggable VU meter bar with customizable columns and auto-sleep on silence.
Version=2.5

; ---------- Measures ----------

[MeasureAudioRaw]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=15
FFTDecay=90
Bands=#VizBands#
FreqMin=35
FreqMax=16000
Sensitivity=#VizSensitivity#

