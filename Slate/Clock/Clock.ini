[Rainmeter]
Update=15000
AccurateText=1
SkinWidth=260
SkinHeight=132
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate Clock
Author=Slate Contributors
Information=Local time and date card (QuantoFlx 4x2 style).
Version=2.4

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %d, %Y
UpdateDivider=4

[MeasureTZ]
Measure=Time
Format=%z
UpdateDivider=240
RegExpSubstitute=1
Substitute="^\+0100$":"CET  ·  UTC+1","^\+0200$":"CEST  ·  UTC+2","^([\+\-])0(\d)00$":"UTC\1\2","^([\+\-]\d\d)(\d\d)$":"UTC\1:\2"

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterTZ]
Meter=String
MeterStyle=FaintStyle
MeasureName=MeasureTZ
X=128
Y=22
StringAlign=CenterCenter
Text=%1

[MeterTime]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=46
MeasureName=MeasureTime
X=128
Y=62
StringAlign=CenterCenter
Text=%1

[MeterDate]
Meter=String
MeterStyle=SecondaryStyle
MeasureName=MeasureDate
X=128
Y=104
StringAlign=CenterCenter
Text=%1
