[Rainmeter]
DefaultAlwaysOnTop=-2
Update=15000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!CommandMeasure MeasureLayoutWatch "Run"][!CommandMeasure MeasureUpdateCheck "Run"]
ContextTitle=Check for Slate Updates (v#SlateVersion#)
ContextAction=[!CommandMeasure MeasureUpdateCheckForce "Run"]

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
LockColor=155,164,178,105
LockShackleY=5
LockTip=Cards LOCKED (click to unlock & drag)
UpdateHidden=1
UpdateText=
UpdateTip=Slate v#SlateVersion# (Up to date)

[Metadata]
Name=Slate Clock
Author=Slate Contributors
Information=Local time and date card (QuantoFlx 4x2 style).
Version=3.0.0

[MeasureLayoutWatch]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\relayout.ps1" -Action Watch
State=Hide
UpdateDivider=1

[MeasureLayoutRealign]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\relayout.ps1" -Action Realign -Force
State=Hide
UpdateDivider=-1

[MeasureLayoutSave]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\relayout.ps1" -Action Save
State=Hide
UpdateDivider=-1

[MeasureLayoutReset]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\relayout.ps1" -Action Reset
State=Hide
UpdateDivider=-1

[MeasureLayoutLock]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\relayout.ps1" -Action ToggleLock
State=Hide
UpdateDivider=-1

[MeasureUpdateCheck]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\updater.ps1" -Action Check
State=Hide
UpdateDivider=240

[MeasureUpdateCheckForce]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\updater.ps1" -Action Check -Force
State=Hide
UpdateDivider=-1

[MeasureUpdateApply]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\updater.ps1" -Action Apply
State=Hide
UpdateDivider=-1

[MeasureUpdateNotes]
Measure=Plugin
Plugin=RunCommand
Program=pwsh.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\updater.ps1" -Action OpenNotes
State=Hide
UpdateDivider=-1

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %d, %Y
UpdateDivider=4

[MeasureTZ]
Measure=Time
Format=%z
UpdateDivider=240
RegExpSubstitute=1
Substitute="^\+0100$":"CET  ·  UTC+1","^\+0200$":"CEST  ·  UTC+2","^([\+\-])0(\d)00$":"UTC\1\2","^([\+\-]\d\d)(\d\d)$":"UTC\1:\2"

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterTZ]
Meter=String
MeterStyle=FaintStyle
MeasureName=MeasureTZ
X=128
Y=22
StringAlign=CenterCenter
Text=%1

[MeterTime]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=46
MeasureName=MeasureTime
X=128
Y=62
StringAlign=CenterCenter
Text=%1

[MeterDate]
Meter=String
MeterStyle=SecondaryStyle
MeasureName=MeasureDate
X=128
Y=104
StringAlign=CenterCenter
Text=%1

; --- Subtle Layout Controls (top-right corner: Lock & Realign/Save) ---
[MeterBtnLock]
Meter=Shape
X=214
Y=13
Shape=Rectangle 2,5,8,6,1.5,1.5 | StrokeWidth 1.2 | Stroke Color #LockColor# | Fill Color 0,0,0,1
Shape2=Line 4,5,4,1.5 | StrokeWidth 1.2 | Stroke Color #LockColor#
Shape3=Line 8,#LockShackleY#,8,1.5 | StrokeWidth 1.2 | Stroke Color #LockColor#
Shape4=Line 4,1.5,8,1.5 | StrokeWidth 1.2 | Stroke Color #LockColor#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLayoutLock "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=#LockTip#

[MeterBtnLayout]
Meter=Shape
X=232
Y=13
Shape=Rectangle 1,1,4,4,1,1 | StrokeWidth 1.2 | Stroke Color 155,164,178,125 | Fill Color 0,0,0,1
Shape2=Rectangle 7,1,4,4,1,1 | StrokeWidth 1.2 | Stroke Color #AccentColor#,185 | Fill Color 0,0,0,1
Shape3=Rectangle 1,7,4,4,1,1 | StrokeWidth 1.2 | Stroke Color 155,164,178,125 | Fill Color 0,0,0,1
Shape4=Rectangle 7,7,4,4,1,1 | StrokeWidth 1.2 | Stroke Color 155,164,178,125 | Fill Color 0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureLayoutRealign "Run"]
RightMouseUpAction=[!CommandMeasure MeasureLayoutSave "Run"]
MiddleMouseUpAction=[!CommandMeasure MeasureLayoutReset "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Left-click: Realign cards · Right-click: Save current positions · Middle-click: Reset to smart default

; --- Subtle Update Pill (top-left corner, hidden until a newer GitHub Release exists) ---
[MeterUpdatePill]
Meter=Shape
X=12
Y=12
Shape=Rectangle 0,0,54,16,4,4 | StrokeWidth 1 | Stroke Color #AccentColor#,210 | Fill Color #AccentFill#
DynamicVariables=1
Hidden=#UpdateHidden#
LeftMouseUpAction=[!CommandMeasure MeasureUpdateApply "Run"]
RightMouseUpAction=[!CommandMeasure MeasureUpdateNotes "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=#UpdateTip#

[MeterUpdateText]
Meter=String
FontFace=#FontMono#
FontSize=7
FontColor=#AccentColor#,255
AntiAlias=1
X=39
Y=20
StringAlign=CenterCenter
Text=#UpdateText#
DynamicVariables=1
Hidden=#UpdateHidden#
LeftMouseUpAction=[!CommandMeasure MeasureUpdateApply "Run"]
RightMouseUpAction=[!CommandMeasure MeasureUpdateNotes "Run"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=#UpdateTip#
