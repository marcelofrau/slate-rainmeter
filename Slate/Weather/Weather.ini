[Rainmeter]
DefaultAlwaysOnTop=-2
Update=900000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
CurIcon=1\02.png

[Metadata]
Name=Slate Weather
Author=Slate Contributors
Information=Hero weather card: icon, current temp, feels like, min/max (Open-Meteo).
Version=2.4

; ---------- Measures ----------
; Update=900000 (15 min): zero polling por segundo! WebParser atualiza
; no load e a cada 15 min, disparando FinishAction para redesenhar.

[MeasureWeather]
Measure=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,apparent_temperature,is_day,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1
RegExp=(?si).*"current":\{[^}]*"temperature_2m":([-0-9.]+).*"apparent_temperature":([-0-9.]+).*"is_day":(\d+).*"weather_code":(\d+).*"daily":\{[^}]*"temperature_2m_max":\[([-0-9.]+)\].*"temperature_2m_min":\[([-0-9.]+)\]
UpdateRate=1
FinishAction=[!UpdateMeasureGroup WeatherChildren][!UpdateMeter *][!Redraw]

[MeasureTempRaw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1
Group=WeatherChildren
UpdateDivider=-1

[MeasureTemp]
Measure=Calc
Formula=Round(MeasureTempRaw)
Group=WeatherChildren
UpdateDivider=-1

[MeasureFeelsRaw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2
Group=WeatherChildren
UpdateDivider=-1

[MeasureFeels]
Measure=Calc
Formula=Round(MeasureFeelsRaw)
Group=WeatherChildren
UpdateDivider=-1

[MeasureIsDay]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=3
Group=WeatherChildren
UpdateDivider=-1

[MeasureCodePadded]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4
Group=WeatherChildren
UpdateDivider=-1
RegExpSubstitute=1
Substitute="^([0-9])$":"0\1"

[MeasureCodeLabel]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4
Group=WeatherChildren
UpdateDivider=-1
RegExpSubstitute=1
Substitute="^0$":"Clear sky","^1$":"Mainly clear","^2$":"Partly cloudy","^3$":"Overcast","^(45|48)$":"Fog","^(51|53|55)$":"Drizzle","^(56|57)$":"Freezing drizzle","^61$":"Slight rain","^63$":"Moderate rain","^65$":"Heavy rain","^(66|67)$":"Freezing rain","^(71|73|75|77)$":"Snow","^(80|81|82)$":"Rain showers","^(85|86)$":"Snow showers","^(95|96|99)$":"Thunderstorm"

[MeasureMaxD0Raw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=5
Group=WeatherChildren
UpdateDivider=-1

[MeasureMaxD0]
Measure=Calc
Formula=Round(MeasureMaxD0Raw)
Group=WeatherChildren
UpdateDivider=-1

[MeasureMinD0Raw]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=6
Group=WeatherChildren
UpdateDivider=-1

[MeasureMinD0]
Measure=Calc
Formula=Round(MeasureMinD0Raw)
Group=WeatherChildren
UpdateDivider=-1

[MeasureRangeRatio]
Measure=Calc
Formula=Clamp((MeasureTempRaw - MeasureMinD0Raw) / Max(MeasureMaxD0Raw - MeasureMinD0Raw, 0.5), 0.08, 1)
Group=WeatherChildren
UpdateDivider=-1

[MeasureIconState]
Measure=String
String=[MeasureIsDay]\[MeasureCodePadded]
DynamicVariables=1
UpdateDivider=-1
Group=WeatherChildren
IfConditionMode=1
IfMatch=^[01]\\\d{2}$
IfMatchAction=[!SetVariable CurIcon "[MeasureIsDay]\[MeasureCodePadded].png"]

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterLocation]
Meter=String
MeterStyle=BoldStyle
X=16
Y=12
StringAlign=LeftTop
Text=#LocationName#

[MeterCondition]
Meter=String
MeterStyle=TextStyle
FontColor=#AccentColor#,255
MeasureName=MeasureCodeLabel
X=240
Y=13
StringAlign=RightTop
Text=%1

[MeterCurrentIcon]
Meter=Image
ImageName=#@#Images\Weather\#CurIcon#
DynamicVariables=1
X=14
Y=34
W=56
H=56
AntiAlias=1

[MeterTemp]
Meter=String
MeterStyle=TextStyle
FontFace=#FontClock#
FontSize=34
MeasureName=MeasureTemp
X=78
Y=32
StringAlign=LeftTop
NumOfDecimals=0
Text=%1°

[MeterFeelsLabel]
Meter=String
MeterStyle=FaintStyle
FontSize=8
X=240
Y=40
StringAlign=RightTop
Text=FL

[MeterFeelsVal]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=12
MeasureName=MeasureFeels
X=240
Y=55
StringAlign=RightTop
NumOfDecimals=0
Text=%1°#UnitTemp#

; --- Bottom Min / Max thermal bar ---
[MeterRangeDivider]
Meter=Shape
Shape=Line 16,94,240,94 | StrokeWidth 1 | Stroke Color 255,255,255,22

[MeterMinText]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
FontSize=9
X=16
Y=109
StringAlign=LeftCenter
DynamicVariables=1
Text=MIN  [MeasureMinD0:0]°
InlinePattern=MIN  
InlineSetting=Color | #TextFaint#

[MeterRangeTrack]
Meter=Shape
X=92
Y=108
Shape=Rectangle 0,0.5,72,2,1,1 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(72 * [MeasureRangeRatio]),3,1.5,1.5 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterMaxText]
Meter=String
MeterStyle=TextStyle
FontFace=#FontMono#
FontSize=9
X=240
Y=109
StringAlign=RightCenter
DynamicVariables=1
Text=MAX  [MeasureMaxD0:0]°
InlinePattern=MAX  
InlineSetting=Color | #AccentColor#,255
