[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=64
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc

[Metadata]
Name=Slate Media
Author=Slate Contributors
Information=Now Playing media controller with clean System Uptime standby state (4x1).
Version=2.6

; ---------- Measures ----------

[MeasureMediaTitle]
Measure=Plugin
Plugin=WindowsNowPlaying
PlayerType=TITLE

[MeasureMediaArtist]
Measure=Plugin
Plugin=WindowsNowPlaying
PlayerType=ARTIST

[MeasureMediaState]
Measure=Plugin
Plugin=WindowsNowPlaying
PlayerType=STATE

[MeasureMediaProgress]
Measure=Plugin
Plugin=WindowsNowPlaying
PlayerType=PROGRESS
MinValue=0
MaxValue=100

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!h %2!02i!m
UpdateDivider=15

[MeasureMediaScript]
Measure=Script
ScriptFile=#@#Scripts\media.lua

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x1Style

[MeterIcon]
Meter=Image
ImageName=#@#Images\Icons\Media.png
ImageTint=#TextSecondary#
X=16
Y=18
W=28
H=28
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureMediaState "PlayPause"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Click to Play / Pause

; --- Playing / Paused state (MediaGroup) ---
[MeterTrackTitle]
Meter=String
MeterStyle=BoldStyle
Group=MediaGroup
FontSize=9
X=56
Y=11
W=122
ClipString=1
StringAlign=LeftTop
Text=Track
Hidden=1

[MeterTrackArtist]
Meter=String
MeterStyle=SecondaryStyle
Group=MediaGroup
FontSize=8
X=56
Y=47
W=122
ClipString=1
StringAlign=LeftBottom
Text=Artist
Hidden=1

[MeterBtnPrev]
Meter=Image
Group=MediaGroup
ImageName=#@#Images\Icons\Prev.png
ImageTint=#TextSecondary#
X=184
Y=23
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureMediaState "Previous"]
MouseActionCursor=1
MouseActionCursorName=HAND
Hidden=1

[MeterBtnPlayPause]
Meter=Image
Group=MediaGroup
ImageName=#@#Images\Icons\Play.png
ImageTint=#AccentColor#,255
X=206
Y=23
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureMediaState "PlayPause"]
MouseActionCursor=1
MouseActionCursorName=HAND
Hidden=1

[MeterBtnNext]
Meter=Image
Group=MediaGroup
ImageName=#@#Images\Icons\Next.png
ImageTint=#TextSecondary#
X=228
Y=23
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureMediaState "Next"]
MouseActionCursor=1
MouseActionCursorName=HAND
Hidden=1

[MeterMediaBar]
Meter=Shape
Group=MediaGroup
X=10
Y=54
Shape=Rectangle 0,0.5,236,1,0.5,0.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(236 * Clamp([MeasureMediaProgress],0,100) / 100),2,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1
Hidden=1

; --- Standby state when no media is active (StandbyGroup) ---
[MeterStandbyTitle]
Meter=String
MeterStyle=BoldStyle
Group=StandbyGroup
FontSize=9
X=56
Y=12
StringAlign=LeftTop
Text=System Uptime

[MeterStandbyBadge]
Meter=String
MeterStyle=GraphTitleStyle
Group=StandbyGroup
FontSize=8
X=240
Y=23
StringAlign=RightBottom
Text=STANDBY

[MeterStandbySub]
Meter=String
MeterStyle=SecondaryStyle
Group=StandbyGroup
FontFace=#FontMono#
FontSize=9
MeasureName=MeasureUptime
X=56
Y=49
StringAlign=LeftBottom
Text=Up  %1

[MeterStandbyPlayBtn]
Meter=Image
Group=StandbyGroup
ImageName=#@#Images\Icons\Play.png
ImageTint=#TextSecondary#
X=226
Y=34
W=14
H=14
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureMediaState "PlayPause"]
MouseActionCursor=1
MouseActionCursorName=HAND
ToolTipText=Resume media playback
