[Rainmeter]
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
SkinWidth=256
SkinHeight=128
BackgroundMode=2
SolidColor=0,0,0,1

[Variables]
@include=#@#variables.inc
@include2=#@#styles.inc
@include3=#@#blur.inc
AutoScale=MeasureDiskActive|MeasureDiskGraph|20|0.96|MeasureDiskPeak

[Metadata]
Name=Slate Disk
Author=Slate Contributors
Information=Disk C: space bar + overall disk I/O activity graph (4x2).
Version=2.4

; ---------- Measures ----------
; 1) Espaco do Disco C: (atualiza a cada 30s - espaco em disco nao muda todo segundo)

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=30

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=-1

[MeasureDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDiskSpacePercent]
Measure=Calc
Formula=Round(MeasureDiskUsed / Max(MeasureDiskTotal, 1) * 100)
MinValue=0
MaxValue=100
UpdateDivider=30

[MeasureDiskUsedGB]
Measure=Calc
Formula=MeasureDiskUsed / 1073741824
UpdateDivider=30

[MeasureDiskTotalGB]
Measure=Calc
Formula=MeasureDiskTotal / 1073741824
UpdateDivider=-1

[MeasureDiskFreeGB]
Measure=Calc
Formula=MeasureDiskFree / 1073741824
UpdateDivider=30

; 2) Uso geral de disco (I/O em todos os discos via UsageMonitor _Total)

[MeasureDiskIdleRaw]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=% Idle Time
Name=_Total
Index=0

[MeasureDiskActive]
Measure=Calc
Formula=Clamp(100 - MeasureDiskIdleRaw, 0, 100)
MinValue=0
MaxValue=100

[MeasureDiskGraph]
Measure=Calc
Formula=MeasureDiskActive
MinValue=0
MaxValue=100

[MeasureDiskPeak]
Measure=Calc
Formula=100

[MeasureDiskRead]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Read Bytes/sec
Name=_Total
Index=0

[MeasureDiskWrite]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter=Disk Write Bytes/sec
Name=_Total
Index=0

[MeasureDiskReadNum]
Measure=Calc
Formula=MeasureDiskRead

[MeasureDiskWriteNum]
Measure=Calc
Formula=MeasureDiskWrite

[MeasureAutoScale]
Measure=Script
ScriptFile=#@#Scripts\autoscale.lua

[MeasureLoop]
Measure=Calc
Formula=((MeasureLoop + 2) % 240)

; ---------- Meters ----------

[MeterCard]
Meter=Shape
MeterStyle=Card4x2Style

[MeterIcon]
Meter=Image
MeterStyle=HeaderIconStyle
ImageName=#@#Images\Icons\Drive_4.png
LeftMouseUpAction=["C:\"]
ToolTipText=[MeasureDiskFreeGB:0] GB free on C:
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=BoldStyle
X=60
Y=7
StringAlign=LeftTop
Text=Disk C:

[MeterSpace]
Meter=String
MeterStyle=RightPrimaryStyle
FontSize=8
X=240
Y=9
StringAlign=RightTop
DynamicVariables=1
Text=[MeasureDiskUsedGB:0] / [MeasureDiskTotalGB:0] GB ([MeasureDiskSpacePercent:0]%)

; --- Barra de espaco do C: logo abaixo do titulo/GB (proxima a %) ---
[MeterSpaceBar]
Meter=Shape
X=60
Y=27
Shape=Rectangle 0,0.5,180,1,0.5,0.5 | StrokeWidth 0 | Fill Color #BarTrack#
Shape2=Rectangle 0,0,(180 * Clamp([MeasureDiskSpacePercent],0,100) / 100),2,1,1 | StrokeWidth 0 | Fill Color #AccentColor#,255
DynamicVariables=1

[MeterReadVal]
Meter=String
MeterStyle=SecondaryStyle
FontFace=#FontMono#
FontSize=8
MeasureName=MeasureDiskReadNum
X=60
Y=48
StringAlign=LeftBottom
AutoScale=1
NumOfDecimals=1
Text=R %1B/s
InlinePattern=^R 
InlineSetting=Color | #AccentColor#,255

[MeterWriteVal]
Meter=String
MeterStyle=RightSecondaryStyle
FontSize=8
MeasureName=MeasureDiskWriteNum
X=240
Y=48
StringAlign=RightBottom
AutoScale=1
NumOfDecimals=1
Text=W %1B/s
InlinePattern=^W 
InlineSetting=Color | #TextFaint#

; --- Graph Zone (236x64 at X=10, Y=54) ---
[MeterGraphZone]
Meter=Shape
Shape=Rectangle 10,54,236,64,4,4 | StrokeWidth 0 | Fill Color 255,255,255,255

[MeterGrid]
Meter=Image
Container=MeterGraphZone
ImageName=#@#Images\MonoGrid_480x64_8x8.png
X=(10 - [MeasureLoop])
Y=54
W=480
H=64
ImageTint=255,255,255,32
DynamicVariables=1

[MeterHist]
Meter=Histogram
Container=MeterGraphZone
MeasureName=MeasureDiskGraph
X=0
Y=54
W=128
H=64
PrimaryColor=#AccentFill#
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0

[MeterLine]
Meter=Line
Container=MeterGraphZone
MeasureName=MeasureDiskGraph
X=0
Y=54
W=128
H=64
LineColor=#AccentColor#,255
LineWidth=1
AntiAlias=1
TransformationMatrix=2;0;0;1;0;0
TransformStroke=Fixed

[MeterGraphBorder]
Meter=Shape
X=10
Y=54
Shape=Rectangle 0,0,236,64,4,4 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #GraphBorder#

[MeterGraphTitle]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphTitleStyle
MeasureName=MeasureDiskActive
X=16
Y=112
W=130
NumOfDecimals=0
Text=Active %1%

[MeterGraphPeak]
Meter=String
Container=MeterGraphZone
MeterStyle=GraphPeakStyle
MeasureName=MeasureDiskPeak
X=240
Y=60
W=106
NumOfDecimals=0
Text=%1 %
